# Supabase project configuration.
# Real values populated when `supabase init` is run locally.

project_id = "kayan-marketing"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

# The creator portal is intentionally public — the URL token IS the
# auth. Disable Supabase's JWT gateway so requests without an
# Authorization header reach the function, where requirePortalToken
# enforces token + active-status + rate-limit checks itself.
[functions.portal]
verify_jwt = false
